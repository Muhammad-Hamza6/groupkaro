services:
  - type: web
    name: groupkaro-api-staging
    runtime: python
    plan: free
    region: ohio
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: groupkaro-api-staging.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://groupkaro.vercel.app
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
